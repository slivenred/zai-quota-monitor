name: Temporary domain history verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect Wayback history and public scan records
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/history.mjs <<'EOF'
          import fs from 'node:fs';

          const domains = [
            'form.name','file.name','hover.style','state.name','source.zip','target.name','app.name','parent.name',
            'record.name','theme.zip','location.host','site.name','url.host','object.name','key.name','query.name'
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const badTerms = [
            'casino','gambling','sportsbook','betting','slot machine','online slots','porn','xxx','adult video','escort',
            'viagra','cialis','levitra','pharmacy','payday loan','crypto casino','bitcoin casino','marijuana','cannabis',
            '博彩','赌场','色情','成人影片','壯陽','壮阳','貸款','贷款'
          ];
          const parkingTerms = [
            'domain for sale','buy this domain','this domain may be for sale','sedo','afternic','dan.com','bodis',
            'parkingcrew','hugedomains','undeveloped.com','domainmarket','above.com','cashparking'
          ];

          async function request(url, retries = 3) {
            let error;
            for (let i = 0; i <= retries; i++) {
              try {
                const r = await fetch(url, {
                  redirect: 'follow',
                  headers: { 'User-Agent': 'Mozilla/5.0 domain-history-audit/1.0', 'Accept': 'application/json,text/html,*/*' },
                  signal: AbortSignal.timeout(30000)
                });
                if ((r.status === 429 || r.status >= 500) && i < retries) {
                  await sleep(1800 * (i + 1));
                  continue;
                }
                return r;
              } catch (e) {
                error = e;
                if (i < retries) { await sleep(1800 * (i + 1)); continue; }
              }
            }
            throw error ?? new Error('request failed');
          }

          function sampleRows(rows) {
            if (rows.length <= 4) return rows;
            const indexes = [...new Set([0, Math.floor((rows.length - 1) / 3), Math.floor(2 * (rows.length - 1) / 3), rows.length - 1])];
            return indexes.map(i => rows[i]);
          }

          function inspectHtml(html) {
            const lower = html.toLowerCase();
            const titleMatch = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
            const title = titleMatch ? titleMatch[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 180) : '';
            const badMatches = badTerms.filter(term => lower.includes(term.toLowerCase()));
            const parkingMatches = parkingTerms.filter(term => lower.includes(term.toLowerCase()));
            return { title, badMatches, parkingMatches, bytes: Buffer.byteLength(html) };
          }

          async function inspectDomain(domain) {
            const params = new URLSearchParams({
              url: `${domain}/*`, output: 'json', fl: 'timestamp,original,statuscode,mimetype,digest',
              filter: 'statuscode:200', collapse: 'digest', limit: '1000'
            });
            let rows = [];
            let cdxStatus = null;
            let cdxError = null;
            try {
              const r = await request(`https://web.archive.org/cdx/search/cdx?${params.toString()}`, 4);
              cdxStatus = r.status;
              const text = await r.text();
              if (r.ok && text.trim()) {
                const json = JSON.parse(text);
                if (Array.isArray(json) && json.length > 1) {
                  const headers = json[0];
                  rows = json.slice(1).map(values => Object.fromEntries(headers.map((h, i) => [h, values[i]])));
                }
              } else if (!r.ok) cdxError = text.slice(0, 300);
            } catch (e) { cdxError = String(e?.message ?? e); }

            rows.sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp)));
            const snapshots = [];
            for (const row of sampleRows(rows)) {
              try {
                const archived = `https://web.archive.org/web/${row.timestamp}id_/${row.original}`;
                const r = await request(archived, 2);
                const html = await r.text();
                snapshots.push({ timestamp: row.timestamp, original: row.original, status: r.status, ...inspectHtml(html) });
              } catch (e) {
                snapshots.push({ timestamp: row.timestamp, original: row.original, status: null, error: String(e?.message ?? e) });
              }
              await sleep(650);
            }

            let urlscanCount = null;
            let urlscanMalicious = null;
            let urlscanTitles = [];
            let urlscanError = null;
            try {
              const r = await request(`https://urlscan.io/api/v1/search/?q=domain:${encodeURIComponent(domain)}&size=100`, 2);
              const text = await r.text();
              if (r.ok) {
                const data = JSON.parse(text);
                const results = Array.isArray(data.results) ? data.results : [];
                urlscanCount = results.length;
                urlscanMalicious = results.filter(x => x?.verdicts?.overall?.malicious === true).length;
                urlscanTitles = [...new Set(results.map(x => x?.page?.title).filter(Boolean))].slice(0, 8);
              } else urlscanError = text.slice(0, 250);
            } catch (e) { urlscanError = String(e?.message ?? e); }

            const allBad = [...new Set(snapshots.flatMap(x => x.badMatches ?? []))];
            const allParking = [...new Set(snapshots.flatMap(x => x.parkingMatches ?? []))];
            return {
              domain,
              captureCount: rows.length,
              firstCapture: rows[0]?.timestamp ?? null,
              lastCapture: rows.at(-1)?.timestamp ?? null,
              cdxStatus, cdxError,
              badTerms: allBad,
              parkingTerms: allParking,
              snapshots,
              urlscanCount, urlscanMalicious, urlscanTitles, urlscanError
            };
          }

          const results = [];
          for (const domain of domains) {
            const row = await inspectDomain(domain);
            results.push(row);
            console.log(`ROW ${JSON.stringify(row)}`);
            await sleep(850);
          }
          const payload = { checkedAt: new Date().toISOString(), results };
          fs.writeFileSync('/tmp/history-results.json', JSON.stringify(payload, null, 2));
          console.log('RESULTS_JSON_START');
          console.log(JSON.stringify(payload, null, 2));
          console.log('RESULTS_JSON_END');
          EOF
          node /tmp/history.mjs
      - name: Upload history audit
        uses: actions/upload-artifact@v4
        with:
          name: verified-domain-history
          path: /tmp/history-results.json
          retention-days: 1
          if-no-files-found: error
